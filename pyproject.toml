[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-assistant"
version = "0.1.0"
description = "Automated DFIR log triage: parse, detect, extract IOCs, build a timeline and report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dfir-assistant = "dfir_assistant.cli:main"

[tool.setuptools]
packages = ["dfir_assistant"]
